<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-cover bg-center min-h-screen flex flex-col items-center justify-center" style="background-image: url('./images/bg-2.png');">
    <div class="container w-full max-w-md p-4 bg-white bg-opacity-10 backdrop-blur-md rounded-lg shadow-lg">
      <div class="search flex flex-col sm:flex-row items-center gap-2">
        <input id="loc-name" type="text" placeholder="Enter City/Country" class="p-2 w-full border border-gray-300 rounded-md">
        <button id="search-btn" class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition">Search</button>
      </div>

      <div class="info text-center mt-4">
        <div class="location">
          <h3 id="city-name" class="text-xl font-bold">City, Country</h3>
          <h5 id="city-time" class="text-gray-600"></h5>
          <p id="city-temp" class="text-2xl font-semibold"></p>
        </div>

        <div class="wind-humi flex justify-around items-center mt-4">
          <div class="humi flex flex-col items-center">
            <h5 id="city-humidity" class="text-sm font-medium">Humidity</h5>
            <img src="./humidity.png" alt="Humidity" class="w-10 h-10">
          </div>

          <div class="wind flex flex-col items-center">
            <h5 id="city-wind" class="text-sm font-medium">Wind</h5>
            <img src="./wind.png" alt="Wind" class="w-10 h-10">
          </div>
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
